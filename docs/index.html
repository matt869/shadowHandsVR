<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Hands</title>
  <meta name="description" content="Make hand shadows on a lamp-lit wall. Match the silhouette and it comes alive. Play with your hands in VR (Meta Quest) or with your webcam.">
  <meta property="og:title" content="Shadow Hands - hand-shadow puppets in VR">
  <meta property="og:description" content="Shape your real hands to match the silhouette on the wall. Hold it, and the shadow comes alive. Quest Browser or webcam, no install.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://matt869.github.io/shadowHandsVR/">
  <meta property="og:image" content="https://matt869.github.io/shadowHandsVR/media/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="./media/icon_64.png">
  <style>
    :root { --bg: #050507; --fg: #f6efe2; --muted: #b3a894; --accent: #f2c14e; --card: rgba(20,14,12,0.86); --line: rgba(201,154,62,0.5); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* sits over the left curtain so it never covers the screen; top bar on narrow screens */
    #hud { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); text-align: left; width: 300px;
      box-sizing: border-box; padding: 18px 20px 20px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
    #hud .row { flex-direction: column; align-items: stretch; }
    @media (max-width: 760px) { #hud { left: 50%; top: 12px; transform: translateX(-50%); width: min(94vw, 520px); text-align: center; }
      #hud .row { flex-direction: row; justify-content: center; } }
    h1 { margin: 0 0 6px; font: 700 24px Georgia, "Times New Roman", serif; letter-spacing: 0.06em; }
    #status { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    button { font: inherit; font-size: 16px; font-weight: 600; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line);
      background: #3a2a20; color: var(--fg); cursor: pointer; min-height: 46px; }
    button.primary { background: var(--accent); color: #241606; border-color: transparent; }
    button:disabled { background: #2a2622; color: #7a7266; cursor: default; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    #hud.compact { width: auto; padding: 8px 10px; top: 16px; transform: none; }
    @media (max-width: 760px) { #hud.compact { transform: translateX(-50%); } }
    #hud.compact h1, #hud.compact #status { display: none; }
    #hud.compact button { padding: 8px 16px; min-height: 38px; font-size: 14px; }
    #preview { position: fixed; right: 16px; bottom: 16px; width: 224px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
      background: #000; display: none; }
    #preview video, #preview canvas { display: block; width: 224px; height: 168px; }
    #preview video { transform: scaleX(-1); }
    #preview canvas { position: absolute; left: 0; top: 0; }
    #preview p { margin: 0; padding: 6px 10px; font-size: 12px; color: var(--muted); background: rgba(0,0,0,0.6); }
    @media (max-width: 520px) { #preview { width: 150px; } #preview video, #preview canvas { width: 150px; height: 112px; } }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <h1>Shadow Hands</h1>
    <p id="status">Loading...</p>
    <div class="row">
      <button id="play-webcam" class="primary" type="button">Play with your webcam</button>
      <button id="enter-vr" type="button">Enter VR</button>
      <button id="sound" type="button" aria-pressed="true">Sound: on</button>
    </div>
  </div>
  <div id="preview" aria-label="Webcam preview">
    <div style="position:relative"><canvas id="preview-dots" width="224" height="168"></canvas></div>
    <p>Your camera stays on this device.</p>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
