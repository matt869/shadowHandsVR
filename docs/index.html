<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Hands</title>
  <meta name="description" content="Make hand shadows on a lamp-lit wall. Match the silhouette and it comes alive. Hands only - made for Meta Quest.">
  <style>
    :root { --bg: #050507; --fg: #f2f0ea; --muted: #a8a49a; --accent: #ffd36b; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
    #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); text-align: center; width: min(92vw, 520px);
      box-sizing: border-box; padding: 14px 18px 16px; border-radius: 18px; background: rgba(12,12,16,0.82); }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.04em; }
    #status { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.4; }
    #enter-vr { font: inherit; font-size: 18px; font-weight: 600; padding: 14px 34px; border-radius: 999px; border: 0;
      background: var(--accent); color: #1a1408; cursor: pointer; min-height: 48px; }
    #enter-vr:disabled { background: #3a3832; color: #8a867c; cursor: default; }
  </style>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <h1>Shadow Hands</h1>
    <p id="status">Loading...</p>
    <button id="enter-vr" type="button">Enter VR</button>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
